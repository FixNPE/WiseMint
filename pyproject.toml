[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "winemint-finadvisor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.35",
  "groq>=0.9",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "rank_bm25>=0.2",
  "httpx>=0.27",
  "diskcache>=5.6",
  "mlflow>=2.13",
  "plotly>=5.20",
  "pydantic>=2.7",
  "pytest>=8.2",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
