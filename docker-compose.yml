services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - sqlite_data:/app/data
    depends_on:
      - chromadb
      - mlflow
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlruns
      --default-artifact-root /mlruns
    restart: unless-stopped

volumes:
  chromadb_data:
  sqlite_data:
  mlflow_data:
